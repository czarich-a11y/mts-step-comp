<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<title>Steps & Movement Challenge</title>
<meta name="description" content="MTS Steps &amp; Movement Challenge — live team and individual step standings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2E8B6C;
    --pink: #D63A63;
    --gold: #C4872E;
    --teal: #2C6E8E;
    --ink: #16213B;
    --ink-soft: #55617D;
    --cream: #FBF3EA;
    --sand: #F1E3D0;
    --card: #FFFFFF;
    --border: rgba(22,33,59,0.08);
    --shadow: 0 6px 20px rgba(22,33,59,0.07);
    --accent: var(--pink);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --green: #4FCB9F;
      --pink: #FF6E93;
      --gold: #E3A94F;
      --teal: #5FB1D6;
      --ink: #EFE9E0;
      --ink-soft: #A9B2C9;
      --cream: #10172A;
      --sand: #1B2438;
      --card: #171F35;
      --border: rgba(239,233,224,0.10);
      --shadow: 0 10px 28px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --green: #4FCB9F;
    --pink: #FF6E93;
    --gold: #E3A94F;
    --teal: #5FB1D6;
    --ink: #EFE9E0;
    --ink-soft: #A9B2C9;
    --cream: #10172A;
    --sand: #1B2438;
    --card: #171F35;
    --border: rgba(239,233,224,0.10);
    --shadow: 0 10px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-inline: 16px;
    background: var(--cream);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header.top {
    padding-block: 28px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2rem);
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .meta {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: right;
  }
  header.top .meta .day-count {
    display: block;
    font-weight: 600;
    color: var(--ink);
  }

  section { padding-block: 22px; }
  section + section { border-top: 1px solid var(--border); }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  /* Leader spotlight */
  .spotlight {
    background: linear-gradient(155deg, var(--sand), var(--cream));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
  }
  .spotlight .label {
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .spotlight .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.4rem, 5vw, 2rem);
    color: var(--pink);
    margin: 6px 0 4px;
    text-wrap: balance;
  }
  .spotlight .figs {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    color: var(--ink-soft);
  }
  .spotlight .figs strong { color: var(--ink); font-weight: 600; }

  /* Team standings */
  .team-list { display: flex; flex-direction: column; gap: 10px; }
  .team-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .team-row.leader { outline: 2px solid color-mix(in srgb, var(--pink) 45%, transparent); }
  .team-rank {
    width: 30px;
    text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .team-row.leader .team-rank { color: var(--pink); }
  .team-swatch {
    width: 8px;
    align-self: stretch;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .team-info { flex: 1; min-width: 0; }
  .team-name { font-weight: 700; }
  .team-sub { font-size: 0.78rem; color: var(--ink-soft); margin-top: 1px; }
  .team-total {
    text-align: right;
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 1.05rem;
    flex-shrink: 0;
  }
  .team-total .unit { display: block; font-family: "Public Sans", sans-serif; font-weight: 400; font-size: 0.68rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .gain-pill {
    display: inline-block;
    margin-top: 3px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--green);
    font-family: "Public Sans", sans-serif;
  }

  /* Podium */
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .podium-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 8px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .podium-medal { font-size: 1.4rem; }
  .podium-name { font-weight: 700; margin-top: 4px; font-size: 0.92rem; overflow-wrap: anywhere; }
  .podium-team { font-size: 0.68rem; color: var(--ink-soft); margin: 3px 0 8px; }
  .podium-steps { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--pink); font-size: 0.88rem; }

  /* Shoutouts */
  .shout-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
  }
  .shout-name { font-weight: 700; }
  .shout-detail { font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
  .empty-note { color: var(--ink-soft); font-size: 0.88rem; margin: -6px 0 12px; }

  /* Table */
  .table-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .table-controls input, .table-controls select {
    font: inherit;
    padding: 8px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
  }
  .table-controls input { flex: 1; min-width: 140px; }
  .table-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; background: var(--card); }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  td:first-child, td:last-child, th { white-space: nowrap; }
  td .muted { white-space: normal; }
  th {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--card);
  }
  th.active { color: var(--pink); }
  td.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.muted { color: var(--ink-soft); font-size: 0.82rem; }
  tbody tr:last-child td { border-bottom: none; }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    padding-block: 22px 36px;
  }

  @media (max-width: 480px) {
    .podium { grid-template-columns: 1fr; }
    header.top .meta { text-align: left; }
  }
</style>

<div class="wrap">

    <div class="table-scroll">
      <table id="standings-table">
        <thead>

            <th data-sort="total" style="text-align:right;">Steps</th>

        <tbody id="standings-body"></tbody>
      </table>
    </div>
  </section>

  <footer>MTS Steps &amp; Movement Challenge &middot; <span id="footer-date"></span></footer>
</div>

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("challenge-data").textContent);

  var TEAM_COLORS = {};
  var palette = ["var(--pink)", "var(--green)", "var(--teal)", "var(--gold)"];
  data.teams.forEach(function (t, i) { TEAM_COLORS[t.name] = palette[i % palette.length]; });

  function fmt(n) { return Number(n).toLocaleString("en-US"); }

  function formatDate(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  document.getElementById("day-count").textContent = "Day " + data.num_days;
  document.getElementById("asof").textContent = " · Standings as of " + formatDate(data.latest_date);
  document.getElementById("footer-date").textContent = "updated " + formatDate(data.latest_date);

  document.getElementById("leader-name").textContent = data.leader.name;
  document.getElementById("leader-total").textContent = fmt(data.leader.total);
  document.getElementById("leader-margin").textContent = data.margin_over_second != null
    ? fmt(data.margin_over_second) + " ahead of 2nd place"
    : "season underway";

  var medals = ["🏆", "🥈", "🥉"];
  var teamListEl = document.getElementById("team-list");
  data.teams.forEach(function (t) {
    var row = document.createElement("div");
    row.className = "team-row" + (t.rank === 1 ? " leader" : "");
    var gain = "";
    if (typeof t.gain_today === "number") {
      gain = '<span class="gain-pill">+' + fmt(t.gain_today) + ' today</span>';
    }
    row.innerHTML =
      '<div class="team-rank">' + (medals[t.rank - 1] || t.rank) + '</div>' +
      '<div class="team-swatch" style="background:' + TEAM_COLORS[t.name] + '"></div>' +
      '<div class="team-info">' +
        '<div class="team-name">' + t.name + '</div>' +
        '<div class="team-sub">' + t.members + ' walkers' + (gain ? " · " + gain : "") + '</div>' +
      '</div>' +
      '<div class="team-total">' + fmt(t.total) + '<span class="unit">steps</span></div>';
    teamListEl.appendChild(row);
  });

  var podiumEl = document.getElementById("podium");
  data.podium.forEach(function (p, i) {
    var card = document.createElement("div");
    card.className = "podium-card";
    card.innerHTML =
      '<div class="podium-medal">' + medals[i] + '</div>' +
      '<div class="podium-name">' + p.name + '</div>' +
      '<div class="podium-team">' + p.team + '</div>' +
      '<div class="podium-steps">' + fmt(p.total) + ' steps</div>';
    podiumEl.appendChild(card);
  });

  var shoutEl = document.getElementById("shoutouts");
  if (data.shoutouts.length === 0) {
    shoutEl.innerHTML = '<p class="empty-note" style="margin:0;">Every team has a podium finisher today.</p>';
  } else {
    data.shoutouts.forEach(function (s) {
      var card = document.createElement("div");
      card.className = "shout-card";
      card.innerHTML =
        '<div class="shout-name">' + s.name + '</div>' +
        '<div class="shout-detail">#' + s.rank + ' overall · leading ' + s.team + ' · ' + fmt(s.total) + ' steps</div>';
      shoutEl.appendChild(card);
    });
  }

  var teamFilter = document.getElementById("team-filter");
  data.teams.forEach(function (t) {
    var opt = document.createElement("option");
    opt.value = t.name;
    opt.textContent = t.name;
    teamFilter.appendChild(opt);
  });

  var sortKey = "rank", sortDir = 1;
  var tbody = document.getElementById("standings-body");
  var searchInput = document.getElementById("search");

  function render() {
    var q = searchInput.value.trim().toLowerCase();
    var team = teamFilter.value;
    var rows = data.individuals.filter(function (p) {
      if (team && p.team !== team) return false;
      if (q && p.name.toLowerCase().indexOf(q) === -1 && p.team.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    rows = rows.slice().sort(function (a, b) {
      var av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
    tbody.innerHTML = rows.map(function (p) {
      return "<tr><td>" + p.rank + "</td><td>" + p.name +
        "<div class=\"muted\">" + p.team + "</div></td><td class=\"num\">" + fmt(p.total) + "</td></tr>";
    }).join("");
  }

  document.querySelectorAll("th[data-sort]").forEach(function (th) {
    th.addEventListener("click", function () {
      var key = th.getAttribute("data-sort");
      if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = key === "name" || key === "team" ? 1 : -1; }
      document.querySelectorAll("th[data-sort]").forEach(function (h) { h.classList.remove("active"); });
      th.classList.add("active");
      render();
    });
  });
  searchInput.addEventListener("input", render);
  teamFilter.addEventListener("change", render);

  render();
})();
</script>
